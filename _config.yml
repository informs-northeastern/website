# Technical settings for GitHub Pages. Content editors never need this file: the words are in the content folder.

title: INFORMS at Northeastern

# Where the site lives. If the chapter moves to its own domain (e.g. https://informsnu.org), set
#   url: https://informsnu.org
#   baseurl: ""
# and add the domain under Settings > Pages on GitHub.
url: https://informs-northeastern.github.io
baseurl: /website

# The folder with all the words (Jekyll calls it the data folder).
data_dir: content

timezone: America/New_York

# Visitor statistics (optional, free, no cookies). Create an account at https://www.goatcounter.com,
# pick a code (for example informs-neu), and put the code here. Leave empty to turn statistics off.
goatcounter: ""

# Google Search Console (optional). Add the site at https://search.google.com/search-console as a
# "URL prefix" property, choose the "HTML tag" method, and paste only the content="..." value here.
google_site_verification: ""

# Keep apostrophes and quotes exactly as typed (no curly-quote conversion).
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

# Not published as pages: the words are read from content/ into the pages; the rest are notes for people.
exclude:
  - content
  - photos/README.md
  - README.md
  - EDITING.md
  - HANDOVER.md
