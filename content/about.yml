page_description: >-
  The INFORMS Student Chapter at Northeastern: what we do, our programs, and seven INFORMS chapter awards.

heading: About the chapter

text: |
  INFORMS is the main professional society for operations research and analytics. We're its student chapter at Northeastern, started in 2015.

  Operations research is the math behind decisions like hospital staffing, delivery routes and airline schedules. You don't need to study it to join. We invite people who use it to talk about their work, teach practical skills, and give students across programs a reason to meet.

  Joining is free, and you don't need to be an INFORMS member.

