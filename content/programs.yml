heading: What we're starting this year

# The big card on the left.
main:
  title: The Speaker Seminar Series
  text: >-
    Once a month, a faculty member, an alum or someone working in Boston talks about how they use
    optimization, simulation or analytics on real problems. Questions and discussion afterwards.
  short: A monthly talk by faculty, alumni or people working in Boston, starting this year.
  facts:
    - label: Format
      value: Lecture and discussion
    - label: Frequency
      value: Monthly
    - label: Audience
      value: Undergraduate, master's, doctoral, faculty
    - label: Location
      value: Boston campus
    - label: First date
      value: To be announced

