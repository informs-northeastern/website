others:
  - title: Skills Workshops
    text: Solvers, Python for optimization, simulation and data visualization.
  - title: Doctoral Lightning Talks
    text: Short research talks by doctoral students, open to all.
  - title: Gatherings
    text: Coffee hours and the occasional outing.

